<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>原稿圖片讀取測試</title>
  <style>
    body {
      font: 16px system-ui;
      background: #f8f8f4;
      color: #17281f;
      margin: 32px;
    }
    button,
    input {
      font: inherit;
      margin: 8px;
      padding: 12px;
    }
    #images {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    figure {
      width: 240px;
      margin: 0;
    }
    img {
      width: 100%;
      background: white;
      border: 1px solid #888;
    }
    pre {
      white-space: pre-wrap;
    }
    small {
      display: block;
    }
  </style>
  <h1>原稿圖片讀取測試</h1>
  <p>
    此頁只使用中性測試檔，DOCX 圖片取自內嵌檔案，PDF 圖片由瀏覽器實際繪製原頁。
  </p>
  <button data-kind="docx">測試 DOCX</button
  ><button data-kind="pdf">測試 PDF</button
  ><input
    type="file"
    accept=".docx,.pdf,.txt,.md,image/png,image/jpeg,image/webp"
    id="file"
  />
  <p id="status">等待選擇</p>
  <pre id="result"></pre>
  <div id="images"></div>
  <script type="module">
    import { readConversationFile } from "/src/client/conversation-files.ts";
    window.fileResult = null;
    async function run(file) {
      const status = document.querySelector("#status"),
        output = document.querySelector("#result"),
        images = document.querySelector("#images");
      status.textContent = "正在讀取";
      images.replaceChildren();
      try {
        const result = await readConversationFile(file);
        window.fileResult = result;
        output.textContent = JSON.stringify(
          {
            sourceName: result.source.name,
            text: result.source.text,
            referenceCount: result.references.length,
            references: result.references.map((r) => ({
              name: r.name,
              bytes: Math.floor(
                ((r.dataUrl.length - r.dataUrl.indexOf(",") - 1) * 3) / 4,
              ),
            })),
            warnings: result.warnings,
          },
          null,
          2,
        );
        for (const ref of result.references) {
          const figure = document.createElement("figure"),
            img = document.createElement("img"),
            caption = document.createElement("figcaption");
          img.src = ref.dataUrl;
          img.alt = ref.name;
          caption.textContent = ref.name;
          figure.append(img, caption);
          images.append(figure);
        }
        status.textContent = "完成";
      } catch (error) {
        status.textContent = "讀取失敗";
        output.textContent = String(error);
      }
    }
    for (const button of document.querySelectorAll("button[data-kind]"))
      button.addEventListener("click", async () => {
        const kind = button.dataset.kind,
          response = await fetch(`./conversation-visual.${kind}`);
        run(
          new File(
            [await response.arrayBuffer()],
            `conversation-visual.${kind}`,
            {
              type:
                kind === "pdf"
                  ? "application/pdf"
                  : "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            },
          ),
        );
      });
    document.querySelector("#file").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) run(file);
    });
  </script>
</html>
