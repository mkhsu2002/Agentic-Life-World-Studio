name: Validate and deploy World Studio
on:
  push:
    branches: [main, feat/mvp-v001]
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - "scripts/verify-deployment.mjs"
      - ".github/workflows/ci-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - "scripts/verify-deployment.mjs"
      - ".github/workflows/ci-deploy.yml"
permissions:
  contents: read
concurrency:
  group: world-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Apply dev schema and deploy the tested revision
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env dev --remote
          npx wrangler deploy --env dev --var BUILD_REVISION:${GITHUB_SHA}
          node scripts/verify-deployment.mjs https://agentic-world-studio-dev.mkhsu2002.workers.dev ${GITHUB_SHA} dev
      - name: Apply production schema and deploy the same revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env production --remote
          npx wrangler deploy --env production --var BUILD_REVISION:${GITHUB_SHA}
          node scripts/verify-deployment.mjs https://agentic-world-studio-production.mkhsu2002.workers.dev ${GITHUB_SHA} production
