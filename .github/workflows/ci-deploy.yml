name: Validate and deploy World Studio
on:
  push:
    branches: [main, feat/v007-conversation, "world/**"]
    paths: &release_paths
      - "VERSION"
      - "src/**"
      - "sites/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - "scripts/verify-deployment.mjs"
      - "scripts/validate-sites.mjs"
      - "scripts/notify-sites.mjs"
      - ".github/workflows/ci-deploy.yml"
  pull_request:
    branches: [main]
    paths: *release_paths
permissions:
  contents: read
concurrency:
  group: world-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.head_ref != 'feat/v007-conversation' && !startsWith(github.head_ref, 'world/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: node scripts/validate-sites.mjs
        env:
          SITE_DIFF_BASE: ${{ startsWith(github.ref, 'refs/heads/world/') && 'origin/main' || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-build
          path: dist
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-deployment-metadata
          path: deploy-metadata/sites.json
          retention-days: 3
  deploy:
    needs: validate
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/world/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: studio-build
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-deployment-metadata
          path: deploy-metadata
      - name: Apply dev schema and deploy the tested revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env dev --remote
          npx wrangler deploy --env dev --var BUILD_REVISION:${GITHUB_SHA}
          node scripts/verify-deployment.mjs https://agentic-world-studio-dev.mkhsu2002.workers.dev ${GITHUB_SHA} dev
      - name: Apply production schema and deploy the same revision
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env production --remote
          npx wrangler deploy --env production --var BUILD_REVISION:${GITHUB_SHA}
          node scripts/verify-deployment.mjs https://agentic-world-studio-production.mkhsu2002.workers.dev ${GITHUB_SHA} production
      - name: Confirm approved sites after deployment
        env:
          STUDIO_DEPLOY_TOKEN: ${{ secrets.STUDIO_DEPLOY_TOKEN }}
          SITE_DEPLOY_TARGETS: ${{ github.ref == 'refs/heads/main' && 'dev,production' || 'dev' }}
        run: node scripts/notify-sites.mjs
      - name: Report failed deployment without replacing the public website
        if: failure()
        env:
          STUDIO_DEPLOY_TOKEN: ${{ secrets.STUDIO_DEPLOY_TOKEN }}
          SITE_DEPLOY_TARGETS: ${{ github.ref == 'refs/heads/main' && 'dev,production' || 'dev' }}
          SITE_DEPLOY_OUTCOME: failure
        run: node scripts/notify-sites.mjs
  preview:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/world/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted main owns the callback. Generated branch code never runs with credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-deployment-metadata
          path: deploy-metadata
      - name: Stage protected previews without changing public releases
        env:
          STUDIO_DEPLOY_TOKEN: ${{ secrets.STUDIO_DEPLOY_TOKEN }}
        run: node scripts/notify-sites.mjs
